[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "project-fuse"
version = "0.1.0"
description = "Reproducible CPU inference benchmarking with PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
fuse-benchmark = "fuse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
